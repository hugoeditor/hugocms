# Beispiel-Serverblock für Nginx.
#
# Aufbau wie bin/install.sh: Das Hugo-Publish-Verzeichnis wird unter / aus-
# geliefert; darin richtet install.sh die App ein:
#   /edit/       Frontend (Vite-Build; referenziert seine Assets absolut als
#                /edit/..., weil der Build mit base=/edit/ erzeugt wird)
#   /cms-api/    Connector-Endpunkt (cms-api/index.php)
# Das Datenverzeichnis liegt außerhalb des Web-Wurzelverzeichnisses.
#
# Nginx wertet KEINE .htaccess aus. Die Regeln, die unter Apache in den
# .htaccess-Dateien stehen (Caching der App-Hülle, Schutz von Log-/Daten-
# verzeichnis), müssen hier als location-Blöcke stehen.

server {
    listen 80;
    server_name webseite.example.org;
    root /var/www/hugocms;      # Hugo-Publish-Verzeichnis (enthält edit/ und cms-api/)
    index index.html;

    # Veröffentlichte Hugo-Webseite.
    location / {
        try_files $uri $uri/ =404;
    }

    # ---- CMS-Frontend unter /edit/ -----------------------------------------
    # Der Build referenziert seine Assets absolut als /edit/... (base=/edit/),
    # daher MUSS das Frontend unter genau diesem Pfad liegen.
    #
    # ACHTUNG bei den add_header-Zeilen: Sobald ein location-Block ein eigenes
    # add_header enthält, verwirft Nginx SÄMTLICHE add_header der server-Ebene
    # für diesen Block — sie werden nicht ergänzt, sondern ersetzt. Wer auf
    # server-Ebene weitere Header setzt (HSTS, X-Content-Type-Options …), muss
    # sie in jedem der drei Blöcke unten wiederholen.
    #
    # Die App ist ein eigenständiges Programm, keine Seite der Webseite — ihre
    # CSP steht deshalb hier und nicht bei der Webseite. Einzige Lockerung ist
    # 'unsafe-inline' bei style-src, weil Vuetify und eigene :style-Bindungen
    # laufend style-Attribute setzen; 'unsafe-eval' braucht der Client nicht.
    # Eine CSP der Webseite mit "require-trusted-types-for 'script'" gilt hier
    # bewusst nicht.
    location /edit/ {
        try_files $uri $uri/ /edit/index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    }

    # index.html NIE festhalten: Der Browser prüft bei jedem Laden per ETag, ob
    # ein neuer Build vorliegt — so erscheint ein Update sofort. Winzige Datei,
    # vernachlässigbare Kosten.
    location = /edit/index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    }

    # Gehashte Assets (Vite): Der Dateiname ändert sich mit jedem Build, daher
    # dauerhaft cachebar — das ist der Geschwindigkeitsgewinn. Nur was in
    # assets/ liegt, ist gehasht; alles andere unter /edit/ bleibt bei der
    # Vorgabe des ersten Blocks.
    location /edit/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- API-Endpunkt ------------------------------------------------------
    # Jede Anfrage unter /cms-api/ bearbeitet der Connector (cms-api/index.php).
    # Der Befehl steckt im Query-Parameter cmd, daher genügt ein fester
    # SCRIPT_FILENAME. Die JSON-Antworten tragen bereits Cache-Control: no-store
    # (siehe Response.php) — hier ist keine zusätzliche Cache-Regel nötig.
    location ^~ /cms-api/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/cms-api/index.php;
        fastcgi_param SCRIPT_NAME /cms-api/;
    }

    # Das Datenverzeichnis liegt außerhalb von root und ist damit nicht
    # direkt erreichbar. Falls es doch innerhalb liegen MUSS, hier sperren:
    # location ^~ /daten/ { deny all; return 404; }

    # Logdateien niemals ausliefern.
    location ^~ /log/ { deny all; return 404; }

    # Laufzeitdaten ebenso wenig: Sitzungen, Freigabe-Entwürfe und die gebauten
    # Seitenvorschauen (unveröffentlichte Stände). Nötig nur, falls backend/
    # entgegen der Empfehlung innerhalb von root liegt.
    location ^~ /backend/var/ { deny all; return 404; }
}
