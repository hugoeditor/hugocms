# Beispiel-Serverblock für Nginx.
# Annahme: gebautes Frontend (frontend/dist) und Connector (index.php) liegen
# unter /var/www/hugocms, das Datenverzeichnis außerhalb davon.

server {
    listen 80;
    server_name dateimanager.example.org;
    root /var/www/hugocms;
    index index.html;

    # Statisches Frontend (Vite-Build in dist/, hierher kopiert).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API-Endpunkt: jede Anfrage unter /cms-api/ wird vom Connector index.php
    # bearbeitet. Der Befehl steckt im Query-Parameter cmd, daher genügt es,
    # SCRIPT_FILENAME fest auf index.php zu setzen.
    location ^~ /cms-api/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /cms-api/;
    }

    # Das Datenverzeichnis liegt außerhalb von root und ist damit nicht
    # direkt erreichbar. Falls es doch innerhalb liegen MUSS, hier sperren:
    # location ^~ /daten/ { deny all; return 404; }

    # Logdateien niemals ausliefern.
    location ^~ /log/ { deny all; return 404; }
}
