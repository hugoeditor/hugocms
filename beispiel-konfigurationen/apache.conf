# Beispiel-VirtualHost für Apache 2.4 mit PHP-FPM oder mod_php.
# Annahme: gebautes Frontend (frontend/dist) und Connector (index.php) liegen
# unter /var/www/hugocms, das Datenverzeichnis außerhalb davon.

<VirtualHost *:80>
    ServerName dateimanager.example.org
    DocumentRoot /var/www/hugocms

    <Directory /var/www/hugocms>
        Options -Indexes
        AllowOverride All
        Require all granted

        RewriteEngine On

        # API-Endpunkt: /cms-api/ auf die Connector-index.php lenken.
        # QSA hängt den Query-String (cmd=…) an, L beendet die Verarbeitung.
        RewriteRule ^cms-api/?$ index.php [L,QSA]

        # SPA-Fallback: übrige unbekannte Pfade auf index.html lenken.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # Falls das Datenverzeichnis doch innerhalb von DocumentRoot liegt,
    # zusätzlich über die mitgelieferte daten/.htaccess absichern.
</VirtualHost>
